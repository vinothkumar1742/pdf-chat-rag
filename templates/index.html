<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with your PDF</title>
  <style>
    :root {
      --bg: #f5f6fa; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
      --border: #e5e7eb; --primary: #4f46e5; --primary-dark: #4338ca;
      --user-bubble: #4f46e5; --bot-bubble: #eef0f6; --chip: #e0e7ff; --chip-text: #3730a3;
      --ok: #16a34a; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117; --card: #181b24; --text: #e8eaf0; --muted: #9aa1b2;
        --border: #2a2f3c; --bot-bubble: #232736; --chip: #2b3158; --chip-text: #c7d2fe;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; justify-content: center; padding: 20px;
    }
    .app {
      width: 100%; max-width: 820px; background: var(--card);
      border: 1px solid var(--border); border-radius: 18px;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* Header */
    header {
      padding: 16px 22px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 38px; height: 38px; border-radius: 10px; background: var(--primary);
      color: #fff; display: grid; place-items: center; font-size: 20px;
    }
    .brand h1 { font-size: 17px; }
    .brand p { font-size: 12px; color: var(--muted); }

    /* Upload */
    .upload { padding: 14px 22px; border-bottom: 1px solid var(--border); }
    .drop {
      border: 2px dashed var(--border); border-radius: 12px; padding: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      transition: 0.2s; cursor: pointer;
    }
    .drop:hover, .drop.drag { border-color: var(--primary); background: rgba(79, 70, 229, 0.06); }
    .drop .info { font-size: 14px; }
    .drop .info small { display: block; color: var(--muted); margin-top: 2px; }
    #fileName { font-weight: 600; }
    .status { font-size: 13px; margin-top: 8px; min-height: 18px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .status.busy { color: var(--muted); }

    button {
      background: var(--primary); color: #fff; border: none; border-radius: 10px;
      padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .ghost:hover { background: rgba(79, 70, 229, 0.08); }

    /* Chat */
    .chat { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 82%; padding: 12px 16px; border-radius: 16px; line-height: 1.55;
           font-size: 15px; white-space: pre-wrap; word-wrap: break-word; animation: pop 0.2s ease; }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; }
    .sources { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
    .chip { background: var(--chip); color: var(--chip-text); padding: 2px 9px; border-radius: 999px; font-weight: 600; }
    .empty { margin: auto; text-align: center; color: var(--muted); }
    .empty .big { font-size: 42px; margin-bottom: 8px; }
    .suggest { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .suggest button { font-size: 13px; padding: 7px 12px; }

    .typing span { display: inline-block; width: 7px; height: 7px; margin-right: 4px;
                   background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Input */
    .input { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .input input {
      flex: 1; padding: 12px 16px; font-size: 15px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none;
    }
    .input input:focus { border-color: var(--primary); }

    @media (max-width: 600px) {
      body { padding: 0; }
      .app { border-radius: 0; border: none; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">📄</div>
        <div>
          <h1>Chat with your PDF</h1>
          <p>Upload a document and ask questions about it</p>
        </div>
      </div>
      <button class="ghost" onclick="clearChat()">Clear chat</button>
    </header>

    <div class="upload">
      <div class="drop" id="drop">
        <div class="info">
          <span id="fileName">Drop a PDF here or click to choose</span>
          <small>Only PDFs with selectable text work</small>
        </div>
        <button id="uploadBtn" onclick="event.stopPropagation(); upload()" disabled>Upload</button>
        <input type="file" id="file" accept=".pdf" hidden>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="chat" id="chat">
      <div class="empty" id="empty">
        <div class="big">💬</div>
        <div>Upload a PDF, then ask your first question</div>
        <div class="suggest">
          <button class="ghost" onclick="useSuggestion('Summarize this document')">Summarize this document</button>
          <button class="ghost" onclick="useSuggestion('What are the key points?')">What are the key points?</button>
        </div>
      </div>
    </div>

    <div class="input">
      <input type="text" id="q" placeholder="Ask a question about your PDF..." autocomplete="off">
      <button id="sendBtn" onclick="send()">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("file");
    const statusEl = document.getElementById("status");
    const uploadBtn = document.getElementById("uploadBtn");
    const qInput = document.getElementById("q");
    const sendBtn = document.getElementById("sendBtn");

    // ----- Upload area -----
    drop.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => pickFile(fileInput.files[0]));
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
    drop.addEventListener("drop", e => {
      e.preventDefault(); drop.classList.remove("drag");
      const f = e.dataTransfer.files[0];
      if (f) { fileInput.files = e.dataTransfer.files; pickFile(f); }
    });

    function pickFile(f) {
      if (!f) return;
      document.getElementById("fileName").textContent = f.name;
      uploadBtn.disabled = false;
      setStatus("", "");
    }

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    async function upload() {
      const f = fileInput.files[0];
      if (!f) return;
      const data = new FormData();
      data.append("file", f);
      uploadBtn.disabled = true;
      setStatus("Reading and indexing your PDF...", "busy");
      try {
        const r = await fetch("/upload", { method: "POST", body: data });
        const j = await r.json();
        if (r.ok) {
          setStatus("✓ " + j.message + " You can ask questions now.", "ok");
          clearChat();
        } else {
          setStatus(j.error || "Upload failed", "err");
        }
      } catch (e) {
        setStatus("Could not reach the server", "err");
      }
      uploadBtn.disabled = false;
    }

    // ----- Chat -----
    function hideEmpty() {
      const e = document.getElementById("empty");
      if (e) e.remove();
    }

    function addMessage(text, who, pages) {
      hideEmpty();
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      if (pages && pages.length) {
        const s = document.createElement("div");
        s.className = "sources";
        s.append("Sources:");
        pages.forEach(p => {
          const c = document.createElement("span");
          c.className = "chip";
          c.textContent = "Page " + p;
          s.append(c);
        });
        div.append(s);
      }
      chat.append(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function addTyping() {
      hideEmpty();
      const div = document.createElement("div");
      div.className = "msg bot typing";
      div.innerHTML = "<span></span><span></span><span></span>";
      chat.append(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function send() {
      const question = qInput.value.trim();
      if (!question) return;
      qInput.value = "";
      addMessage(question, "user");
      sendBtn.disabled = true;
      const typing = addTyping();
      try {
        const r = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const j = await r.json();
        typing.remove();
        if (r.ok) addMessage(j.answer, "bot", j.pages);
        else addMessage(j.error || "Something went wrong", "bot");
      } catch (e) {
        typing.remove();
        addMessage("Could not reach the server. Is the app running?", "bot");
      }
      sendBtn.disabled = false;
      qInput.focus();
    }

    qInput.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    function useSuggestion(text) { qInput.value = text; send(); }

    function clearChat() {
      chat.innerHTML = `
        <div class="empty" id="empty">
          <div class="big">💬</div>
          <div>Ask your first question about the PDF</div>
        </div>`;
    }
  </script>
</body>
</html>
